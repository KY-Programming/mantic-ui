<app-root>
    <style>
        body, html {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0D1927;
        }

        ky-app-loader2 {
            position: absolute;
            top: 50%;
            left: 50%;
            translate: -50% -50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 20rem;
            max-width: 100%;
        }

        h1 {
            position: absolute;
            bottom: 100%;
            color: #FFFFFF;
            width: 100%;
            text-align: center;
            margin-bottom: 2rem;
        }

        .sub-header {
            position: absolute;
            left: 50%;
            color: #FFFFFF;
            font-size: 0.75rem;
            opacity: 0.5;
            line-height: 0;
        }

        .icon-wrapper {
            position: relative;
            display: flex;
        }

        .icon {
            position: absolute;
            top: 50%;
            left: 50%;
            translate: -50% -50%;
        }

        svg {
            width: 144px;
            height: 144px;
        }

        circle {
            stroke: #3767A4;
        }

        path:not(.completed):not(.failed) {
            stroke: rgba(255, 255, 255, 0.5);
        }

        path:not(.completed):not(.failed).started {
            animation: pulse 1s infinite alternate;
        }

        path:not(.completed):not(.failed).started.indefinitely {
            animation-duration: 500ms;
        }

        path.completed {
            stroke: rgba(33, 186, 69, 0.9);
        }

        path.failed {
            stroke: rgba(219, 40, 40, 0.9);
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }

        .icon {
            border-radius: 50%;
            overflow: clip;
            background-color: #254B7C;
            color: #FFFFFF;
            width: 128px;
            height: 128px;
        }

        .icon.center {
            padding: 16px;
        }

        .icon-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .icon-content img,
        .icon-content > *:first-child {
            position: absolute;
            left: 50%;
            top: 50%;
            translate: -50% -50%;
            max-width: calc(100% - 2rem);
            max-height: calc(100% - 2rem);
        }

        /* Takes all the room it may: an SVG with width="100%" has no size of its own and would shrink to a fraction of it */
        .icon-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .icon.full .icon-content img,
        .icon.full .icon-content > *:first-child {
            max-width: 100%;
            max-height: 100%;
        }

        .steps {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .step {
            margin-top: 1rem;
            color: #FFFFFF;
            max-width: 22rem;
        }

        p {
            text-align: center;
        }


        @media (max-width: 600px) {
            .step {
                max-width: 100%;
            }
        }

        m-flex {
            display: flex;
        }

        m-flex[column] {
            flex-direction: column;
        }

        m-flex[alignItems="center"] {
            align-items: center;
        }

        m-button,
        [m-button] {
            cursor: pointer;
            display: inline-block;
            min-height: 1em;
            outline: none;
            border: none;
            vertical-align: baseline;
            padding: 0.78571429em 1.5em 0.78571429em;
            text-transform: none;
            text-shadow: none;
            font-weight: bold;
            line-height: 1em;
            font-style: normal;
            text-align: center;
            text-decoration: none;
            border-radius: 0.28571429rem;
            box-shadow: 0px 0px 0px 1px transparent inset, 0px 0em 0px 0px rgba(34, 36, 38, 0.15) inset;
            user-select: none;
            background-color: #254B7C;
            color: #FFFFFF;
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
        }
    </style>
    <script>"use strict";
let filesToLoad = 1;
let filesLoaded = 1;
let longLoading = false;
let veryLongLoading = false;
let errorLoading = false;
const totalAngle = 360;
const thickness = 16;
const radius = 128 + (16 - thickness) / 2;
const width = thickness + radius * 2;
let pathElement;
let stepTextElement;
let stepInfoElement;
let stepButtonsElement;
setTimeout(() => {
    longLoading = true;
    refresh();
}, 10 * 1000);
setTimeout(() => {
    veryLongLoading = true;
    refresh();
}, 15 * 1000);
const refresh = function () {
    pathElement ??= (document.querySelector('path.started') ?? undefined);
    stepTextElement ??= (document.querySelector('.step > .text') ?? undefined);
    stepInfoElement ??= (document.querySelector('.step > .info') ?? undefined);
    stepButtonsElement ??= (document.querySelector('.step > .buttons') ?? undefined);
    if (errorLoading) {
        if (stepTextElement) {
            stepTextElement.innerText = 'Looks like there is something wrong. Try to reload the page.';
        }
        pathElement?.classList.remove('started');
        pathElement?.classList.add('failed');
        if (stepInfoElement) {
            stepInfoElement.innerText = '';
        }
        if (stepButtonsElement) {
            stepButtonsElement.style.display = '';
        }
        return;
    }
    const progress = filesToLoad > 1 ? filesLoaded / filesToLoad : 0;
    const start = 0;
    const end = 6 / 9;
    const current = start + (end - start) * progress;
    pathElement?.setAttribute('d', calculateProgressPath(start, current));
    if (stepTextElement) {
        stepTextElement.innerText = 'loading application... 0%'.replace('0', Math.floor(progress * 100).toString());
    }
    if (stepInfoElement) {
        if (veryLongLoading) {
            stepInfoElement.innerText = 'Something takes very long. Maybe the connection is very slow or something went wrong. Wait a bit more or try to reload.';
        }
        else if (longLoading) {
            stepInfoElement.innerText = 'Something takes longer than usual...';
        }
    }
    if (stepButtonsElement && veryLongLoading) {
        stepButtonsElement.style.display = '';
    }
};
const getPointOnCircle = (radius, angleDegrees) => {
    // Convert degrees to radians
    const angleRadians = (angleDegrees - 90) * Math.PI / 180; // Subtract 90 to start at the top
    const x = radius * Math.cos(angleRadians);
    const y = radius * Math.sin(angleRadians);
    return { x, y };
};
const calculateProgressPath = (start, end) => {
    const offset = thickness / 2;
    const startAngle = start * totalAngle;
    const endAngle = end * totalAngle;
    const startPoint = getPointOnCircle(radius, startAngle);
    const endPoint = getPointOnCircle(radius, endAngle);
    const centerX = radius;
    const centerY = radius;
    const startX = centerX + startPoint.x + offset;
    const startY = centerY + startPoint.y + offset;
    const endX = centerX + endPoint.x + offset;
    const endY = centerY + endPoint.y + offset;
    const angleDifference = endAngle - startAngle;
    const largeArcFlag = angleDifference > 180 ? 1 : 0;
    // Sweep flag is 1 for clockwise
    const sweepFlag = 1;
    return `M ${startX} ${startY} A ${radius} ${radius} 0 ${largeArcFlag} ${sweepFlag} ${endX} ${endY}`;
};
const observer = new MutationObserver(records => {
    for (const record of records) {
        record.addedNodes.forEach(node => {
            if (node instanceof HTMLScriptElement) {
                filesToLoad++;
                refresh();
                node.onload = () => {
                    filesLoaded++;
                    refresh();
                };
                node.onerror = () => {
                    errorLoading = true;
                    refresh();
                };
            }
        });
    }
});
observer.observe(document.body, { childList: true });
</script>
