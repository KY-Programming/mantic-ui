<app-header header="Textarea" subHeader="An area for text"></app-header>

<m-tab-group secondary pointing class="page" selectByRoute>
    <m-tab label="Examples">
        <m-example header="Textarea" description="A input for long or multiline texts">
            <m-textarea placeholder="Enter a long text..."></m-textarea>
            <m-example-code [code]="textCode"></m-example-code>
        </m-example>
        <m-example header="Standard Textarea" description="Use a standard textarea for missing features">
            <m-textarea>
                <textarea rows="2" placeholder="Only two rows high..." #textarea></textarea>
            </m-textarea>
            <m-example-code [code]="standardCode"></m-example-code>
        </m-example>
    </m-tab>
    <m-tab label="Variations">
        <m-example header="Disabled" description="A textarea can show that it is disabled" [code]="disabledCode">
            <m-textarea disabled value="This text can not be changed or selected"></m-textarea>
        </m-example>
        <m-example header="Readonly" description="A textarea can show a value that can not be changed. The text can still be selected" [code]="readonlyCode">
            <m-textarea readonly value="This text can not be changed"></m-textarea>
        </m-example>
        <m-example header="Attached" description="A textarea can be attached to its neighbour. The side names where the textarea sits: attachedTop flattens its bottom corners" [code]="attachedCode">
            <m-flex column>
                <m-textarea attachedTop placeholder="Comment..."></m-textarea>
                <m-button attachedBottom>Send</m-button>
            </m-flex>
        </m-example>
        <m-example header="Inverted" description="A checkbox can be displayed with inverted colors" [code]="inverted">
            <m-segment inverted>
                <m-textarea inverted placeholder="Inverted"></m-textarea>
            </m-segment>
        </m-example>
    </m-tab>
</m-tab-group>
