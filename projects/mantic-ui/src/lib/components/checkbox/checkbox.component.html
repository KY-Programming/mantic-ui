<input type="checkbox" [name]="name() ?? ''" [ngModel]="value()" [indeterminate]="indeterminate()" [attr.aria-readonly]="readonly() || null" class="hidden">
<label [attr.for]="name() ?? ''">
    <span class="label-text">{{ label() }}<ng-content /></span>
    @if (showReadonlyLock()) {
        <m-icon class="readonly-lock-icon" aria-hidden="true" [icon]="currentReadonlyIcon()" [title]="currentReadonlyText()" />
    }
    @if (checked()) {
        <m-icon [icon]="checkIcon() ?? defaults.checkIcon()" [size]="checkIconSize() ?? defaults.checkIconSize()" class="icon" />
    }
    @if (indeterminate()) {
        <m-icon [icon]="indeterminateIcon() ?? defaults.indeterminateIcon()" [size]="indeterminateIconSize() ?? defaults.indeterminateIconSize()" class="icon" />
    }
</label>
