@if (labelInControl()) {
    @if (forceLabel()) {
        <label [attr.for]="name()" class="empty label">&nbsp;</label>
    }
} @else if (label() || hint()) {
    <label [attr.for]="name()" #labelElement>
        {{ label() }}
        @if (hint()) {
            <m-icon [icon]="defaults.hintIcon()" [size]="defaults.hintIconSize()" [title]="hint()" />
        }
        @if (inlineValidation() && errors().length) {
            <m-icon [icon]="defaults.errorIcon()" [size]="defaults.errorIconSize()" [title]="errors() | fieldFormatErrors" />
        }
    </label>
}

<ng-content />

@if (labelInControl() && hint()) {
    <m-icon class="hint" [icon]="defaults.hintIcon()" [size]="defaults.hintIconSize()" [title]="hint()" />
}
@if (labelInControl() && inlineValidation() && errors().length) {
    <m-icon class="error" [icon]="defaults.errorIcon()" [size]="defaults.errorIconSize()" [title]="errors() | fieldFormatErrors" />
}
